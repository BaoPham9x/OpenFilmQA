[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openfilmqa"
version = "0.1.0"
description = "Evidence-first review packets and quality gates for AI-generated films"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Bao Ngoc Pham"}]
dependencies = []

[project.scripts]
openfilmqa = "openfilmqa.__main__:main"

[tool.setuptools]
packages = ["openfilmqa"]
